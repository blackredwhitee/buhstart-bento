name: Build articles

on:
  push:
    paths:
      - '_articles/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild articles.js
        run: node .github/scripts/build-articles.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.js
          git diff --staged --quiet || git commit -m "chore: rebuild articles.js [skip ci]"
          git push
