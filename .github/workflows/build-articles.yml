name: Собрать сайт из данных

on:
  push:
    paths:
      - '_articles/**'
      - '_cases/**'
      - '.github/scripts/build-site.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать страницы, списки, тизеры и карту сайта
        run: node .github/scripts/build-site.js

      - name: Закоммитить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-*.html blog.html novosti.html keysy.html articles.js sitemap.xml
          git diff --staged --quiet || git commit -m "Пересобрать сайт из данных"
          git push
